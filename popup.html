<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">

<button id="copy-button" data-i18n="copyButton"></button>

<h3 data-i18n="format"></h3>

<div>
  <select id="format_select">
    <option data-i18n="selectFormat" selected value=""></option>
    <hr />
    <optgroup class="optgroup" data-i18n="labelText">
      <option class="format-option" value="text-url-only" data-i18n="textUrlOnly"></option>
      <option class="format-option" value="text" data-i18n="textWithTitle"></option>
    </optgroup>
    <hr />
    <optgroup class="optgroup" data-i18n="labelJSON">
      <option class="format-option" value="json-url-array" data-i18n="jsonUrlArray"></option>
      <option class="format-option" value="json-array" data-i18n="jsonArray"></option>
      <option class="format-option" value="json-object" data-i18n="jsonObject"></option>
    </optgroup>
    <hr />
    <optgroup class="optgroup" data-i18n="labelSV">
      <option class="format-option" value="csv" data-i18n="commaSV"></option>
      <option class="format-option" value="tsv" data-i18n="tabSV"></option>
    </optgroup>
  </select>
</div>

<div id="details_section">
  <h3 data-i18n="options"></h3>
  <div class="details-content" id="details-content">
    <div class="option-group text-options">
      <label>
        <input type="checkbox" id="use-empty-lines" checked>
        <span data-i18n="emptyLines"></span>
      </label>
    </div>
    <div class="option-group json-options">
      <label>
        <input type="checkbox" id="use-json-formatting" checked>
        <span data-i18n="formatting"></span>
      </label>
    </div>
  </div>
</div>

<div id="result"></div>
<script src="popup.js"></script>
